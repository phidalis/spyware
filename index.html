<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Surveillance System - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SOC Console">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="brand-badge"><i class="fas fa-shield-alt"></i></div>
            <h1>Secure Operations Center</h1>
            <p>Authorized access only</p>
        </div>
        
        <div class="login-box">
            <div class="boot-console" id="boot-console"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-key"></i> Password
                    </label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                
                <div class="form-group">
                    <label for="security-key">
                        <i class="fas fa-shield-alt"></i> Security Key
                    </label>
                    <input type="text" id="security-key" placeholder="Enter security key" required>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Access Dashboard
                </button>
                
                <div class="login-footer">
                    <p><i class="fas fa-info-circle"></i> GET YOUR SURVAILANCE DASHBOARD </p>
                </div>
            </form>
        </div>
        <div class="simulation-notice">
            <button id="quick-access" class="simulation-btn">
                <i class="fas fa-bolt"></i> Quick Access
            </button>
        </div>
    </div>
    
    <div class="footer">
        <p><i class="fas fa-shield-alt"></i> Secure Operations Center · v2.4 · <a href="about.html">About</a></p>
    </div>
    
    <script src="main.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
