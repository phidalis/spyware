<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Camera &amp; Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SOC Console">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-images"></i> Media Panel</h2>
                <a href="dashboard.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="menu-section">
                    <h3><i class="fas fa-eye"></i> Monitoring</h3>
                    <a href="#" class="menu-item active" data-tab="media">
                        <i class="fas fa-images"></i> Media Library
                    </a>
                </div>

                <div class="menu-section">
                    <h3><i class="fas fa-cogs"></i> Tools</h3>
                    <a href="#" class="menu-item" id="gal-export">
                        <i class="fas fa-file-export"></i> Export Report
                    </a>
                    <a href="dashboard.html" class="menu-item">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="index.html" class="menu-item logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <i class="fas fa-circle status-online"></i>
                    <span>Camera: <strong>Available</strong></span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <h1><i class="fas fa-images"></i> Camera &amp; Gallery</h1>
                <div class="header-actions">
                    <button class="btn-refresh" id="gal-refresh">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="tab-content active" id="media-tab">
                <div class="kpi-grid" id="gal-stats"></div>
                <div class="panel">
                    <div class="panel-head">
                        <h3><i class="fas fa-images"></i> Media Library</h3>
                        <div class="gal-filters">
                            <button class="filter-btn active" data-gal-filter="all">All</button>
                            <button class="filter-btn" data-gal-filter="photo">Photos</button>
                            <button class="filter-btn" data-gal-filter="video">Videos</button>
                            <button class="filter-btn" data-gal-filter="screenshot">Screenshots</button>
                        </div>
                    </div>
                    <div class="gal-grid" id="gal-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="platform.js"></script>
    <script src="modules.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeGalleryPanel();
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
