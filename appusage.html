<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>App Usage &amp; Screen Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SOC Console">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-mobile-alt"></i> Usage Panel</h2>
                <a href="dashboard.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="menu-section">
                    <h3><i class="fas fa-eye"></i> Monitoring</h3>
                    <a href="#" class="menu-item active" data-tab="overview">
                        <i class="fas fa-gauge-high"></i> Overview
                    </a>
                    <a href="#" class="menu-item" data-tab="apps">
                        <i class="fas fa-mobile-alt"></i> By App
                    </a>
                    <a href="#" class="menu-item" data-tab="categories">
                        <i class="fas fa-chart-pie"></i> Categories
                    </a>
                </div>

                <div class="menu-section">
                    <h3><i class="fas fa-cogs"></i> Tools</h3>
                    <a href="#" class="menu-item" id="au-export">
                        <i class="fas fa-file-export"></i> Export Report
                    </a>
                    <a href="dashboard.html" class="menu-item">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="index.html" class="menu-item logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <i class="fas fa-circle status-online"></i>
                    <span>Sync: <strong>Live</strong></span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <h1><i class="fas fa-mobile-alt"></i> App Usage &amp; Screen Time</h1>
                <div class="header-actions">
                    <button class="btn-refresh" id="au-refresh">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Overview -->
            <div class="tab-content active" id="overview-tab">
                <div class="kpi-grid" id="au-stats"></div>
                <div class="panel">
                    <div class="panel-head">
                        <h3><i class="fas fa-chart-column"></i> Hourly Usage</h3>
                        <span class="panel-tag live">TODAY</span>
                    </div>
                    <canvas id="au-hourly" class="module-chart"></canvas>
                </div>
            </div>

            <!-- By App -->
            <div class="tab-content" id="apps-tab">
                <div class="panel">
                    <div class="panel-head">
                        <h3><i class="fas fa-mobile-alt"></i> Time per App</h3>
                        <span class="panel-tag">TODAY</span>
                    </div>
                    <div class="usage-list" id="au-apps"></div>
                </div>
            </div>

            <!-- Categories -->
            <div class="tab-content" id="categories-tab">
                <div class="panel">
                    <div class="panel-head">
                        <h3><i class="fas fa-chart-pie"></i> Usage by Category</h3>
                    </div>
                    <div class="cat-list" id="au-categories"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="platform.js"></script>
    <script src="modules.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeAppUsagePanel();
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
