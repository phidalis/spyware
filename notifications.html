<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notification Mirror</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SOC Console">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-bell"></i> Notifications</h2>
                <a href="dashboard.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="menu-section">
                    <h3><i class="fas fa-eye"></i> Monitoring</h3>
                    <a href="#" class="menu-item active" data-tab="stream">
                        <i class="fas fa-stream"></i> Live Stream
                    </a>
                </div>

                <div class="menu-section">
                    <h3><i class="fas fa-cogs"></i> Tools</h3>
                    <a href="dashboard.html" class="menu-item">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="index.html" class="menu-item logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <i class="fas fa-circle status-online"></i>
                    <span>Mirror: <strong>Streaming</strong></span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <h1><i class="fas fa-bell"></i> Notification Mirror</h1>
                <div class="header-actions">
                    <button class="btn-refresh" id="ntf-refresh">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="btn-add-target" id="ntf-pause">
                        <i class="fas fa-pause"></i> Pause Stream
                    </button>
                </div>
            </div>

            <div class="tab-content active" id="stream-tab">
                <div class="panel">
                    <div class="panel-head">
                        <h3><i class="fas fa-bell"></i> Live Notifications</h3>
                        <div class="ntf-filters">
                            <button class="filter-btn active" data-ntf-filter="all">All</button>
                            <button class="filter-btn" data-ntf-filter="social">Social</button>
                            <button class="filter-btn" data-ntf-filter="messages">Messages</button>
                            <button class="filter-btn" data-ntf-filter="system">System</button>
                        </div>
                    </div>
                    <div class="ntf-list" id="ntf-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="platform.js"></script>
    <script src="modules.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeNotificationsPanel();
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
